name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd apps/backend && pnpm db:generate

      - name: Run type checking
        run: pnpm typecheck

      - name: Run backend tests
        run: pnpm test:backend

  build-and-push:
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version and commit info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, SHA: $SHORT_SHA, Timestamp: $TIMESTAMP"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: alcibiadesc/happy-balance
          tags: |
            type=raw,value=backend-latest
            type=raw,value=backend-v${{ steps.version.outputs.version }}
            type=raw,value=backend-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
            type=raw,value=backend-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            happy-balance.version=${{ steps.version.outputs.version }}
            happy-balance.commit=${{ steps.version.outputs.short_sha }}
            happy-balance.build-timestamp=${{ steps.version.outputs.timestamp }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend.optimized
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.version.outputs.short_sha }}
            BUILD_TIMESTAMP=${{ steps.version.outputs.timestamp }}
          cache-from: type=registry,ref=alcibiadesc/happy-balance:backend-latest
          cache-to: type=inline

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: alcibiadesc/happy-balance
          tags: |
            type=raw,value=frontend-latest
            type=raw,value=frontend-v${{ steps.version.outputs.version }}
            type=raw,value=frontend-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
            type=raw,value=frontend-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            happy-balance.version=${{ steps.version.outputs.version }}
            happy-balance.commit=${{ steps.version.outputs.short_sha }}
            happy-balance.build-timestamp=${{ steps.version.outputs.timestamp }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend.optimized
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ steps.version.outputs.short_sha }}
            BUILD_TIMESTAMP=${{ steps.version.outputs.timestamp }}
          cache-from: type=registry,ref=alcibiadesc/happy-balance:frontend-latest
          cache-to: type=inline

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last release tag or last 20 commits
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s" --no-merges | head -20)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
          fi

          # Escape for GitHub Actions
          COMMITS="${COMMITS//'%'/'%25'}"
          COMMITS="${COMMITS//$'\n'/'%0A'}"
          COMMITS="${COMMITS//$'\r'/'%0D'}"
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          name: Release ${{ steps.version.outputs.version }} (${{ steps.version.outputs.short_sha }})
          body: |
            ## 🚀 Nueva versión disponible

            **Versión:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ steps.version.outputs.short_sha }}
            **Fecha:** ${{ steps.version.outputs.timestamp }}

            ### 📝 Cambios
            ${{ steps.changelog.outputs.commits }}

            ### 🐳 Docker
            ```bash
            docker pull alcibiadesc/happy-balance:backend-latest
            docker pull alcibiadesc/happy-balance:frontend-latest
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 🚀 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.version.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** ${{ steps.version.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Backend Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- \`alcibiadesc/happy-balance:backend-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`alcibiadesc/happy-balance:backend-v${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`alcibiadesc/happy-balance:backend-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Frontend Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- \`alcibiadesc/happy-balance:frontend-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`alcibiadesc/happy-balance:frontend-v${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`alcibiadesc/happy-balance:frontend-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
